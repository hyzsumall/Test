<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAND & DRAM 价格趋势仪表盘</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        header p {
            color: #a0a0a0;
            font-size: 1.1rem;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #a0a0a0;
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
        }

        .stat-card .change {
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .stat-card .change.positive {
            color: #00e676;
        }

        .stat-card .change.negative {
            color: #ff5252;
        }

        .stat-card.nand .value {
            color: #00d4ff;
        }

        .stat-card.dram .value {
            color: #7b2cbf;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chart-container h2 {
            margin-bottom: 20px;
            font-size: 1.3rem;
            color: #fff;
        }

        .chart-wrapper {
            position: relative;
            height: 350px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .data-table {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
        }

        .data-table h2 {
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: #a0a0a0;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        td {
            font-size: 0.95rem;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .positive-cell {
            color: #00e676;
        }

        .negative-cell {
            color: #ff5252;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .chart-wrapper {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>NAND & DRAM 价格趋势仪表盘</h1>
            <p>2025年1月 - 2025年12月 价格走势与增速分析</p>
        </header>

        <div class="stats-cards">
            <div class="stat-card nand">
                <h3>NAND 当前价格</h3>
                <div class="value">$3.85</div>
                <div class="change positive">↑ 28.3% 年度增长</div>
            </div>
            <div class="stat-card dram">
                <h3>DRAM 当前价格</h3>
                <div class="value">$2.92</div>
                <div class="change positive">↑ 35.2% 年度增长</div>
            </div>
            <div class="stat-card nand">
                <h3>NAND 平均月增速</h3>
                <div class="value">2.3%</div>
                <div class="change positive">稳定增长</div>
            </div>
            <div class="stat-card dram">
                <h3>DRAM 平均月增速</h3>
                <div class="value">2.8%</div>
                <div class="change positive">强劲增长</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <h2>价格趋势对比</h2>
                <div class="chart-wrapper">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
            <div class="chart-container">
                <h2>月度增速变化</h2>
                <div class="chart-wrapper">
                    <canvas id="growthChart"></canvas>
                </div>
            </div>
            <div class="chart-container full-width">
                <h2>累计增长率对比</h2>
                <div class="chart-wrapper">
                    <canvas id="cumulativeChart"></canvas>
                </div>
            </div>
        </div>

        <div class="data-table">
            <h2>详细数据表</h2>
            <table>
                <thead>
                    <tr>
                        <th>月份</th>
                        <th>NAND 价格 ($)</th>
                        <th>NAND 增速</th>
                        <th>DRAM 价格 ($)</th>
                        <th>DRAM 增速</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                </tbody>
            </table>
        </div>

        <footer>
            <p>数据来源：模拟数据 | 仅供演示用途 | © 2025 价格趋势仪表盘</p>
        </footer>
    </div>

    <script>
        // 模拟数据 - NAND 和 DRAM 价格（美元/GB）
        const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

        // NAND 价格数据（模拟2025年走势）
        const nandPrices = [3.00, 3.08, 3.18, 3.25, 3.35, 3.42, 3.55, 3.62, 3.70, 3.78, 3.82, 3.85];

        // DRAM 价格数据（模拟2025年走势）
        const dramPrices = [2.16, 2.25, 2.35, 2.42, 2.52, 2.60, 2.68, 2.75, 2.82, 2.88, 2.90, 2.92];

        // 计算月度增速
        function calculateGrowthRates(prices) {
            const rates = [0];
            for (let i = 1; i < prices.length; i++) {
                const rate = ((prices[i] - prices[i-1]) / prices[i-1] * 100).toFixed(2);
                rates.push(parseFloat(rate));
            }
            return rates;
        }

        // 计算累计增长率
        function calculateCumulativeGrowth(prices) {
            const basePrice = prices[0];
            return prices.map(price => ((price - basePrice) / basePrice * 100).toFixed(2));
        }

        const nandGrowth = calculateGrowthRates(nandPrices);
        const dramGrowth = calculateGrowthRates(dramPrices);
        const nandCumulative = calculateCumulativeGrowth(nandPrices);
        const dramCumulative = calculateCumulativeGrowth(dramPrices);

        // 通用图表配置
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: {
                        color: '#fff',
                        font: {
                            size: 12
                        }
                    }
                }
            },
            scales: {
                x: {
                    ticks: { color: '#a0a0a0' },
                    grid: { color: 'rgba(255, 255, 255, 0.05)' }
                },
                y: {
                    ticks: { color: '#a0a0a0' },
                    grid: { color: 'rgba(255, 255, 255, 0.1)' }
                }
            }
        };

        // 价格趋势图
        new Chart(document.getElementById('priceChart'), {
            type: 'line',
            data: {
                labels: months,
                datasets: [
                    {
                        label: 'NAND 价格 ($/GB)',
                        data: nandPrices,
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0, 212, 255, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    },
                    {
                        label: 'DRAM 价格 ($/GB)',
                        data: dramPrices,
                        borderColor: '#7b2cbf',
                        backgroundColor: 'rgba(123, 44, 191, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }
                ]
            },
            options: {
                ...chartOptions,
                plugins: {
                    ...chartOptions.plugins,
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `${context.dataset.label}: $${context.raw.toFixed(2)}`;
                            }
                        }
                    }
                }
            }
        });

        // 月度增速图
        new Chart(document.getElementById('growthChart'), {
            type: 'bar',
            data: {
                labels: months,
                datasets: [
                    {
                        label: 'NAND 月增速 (%)',
                        data: nandGrowth,
                        backgroundColor: 'rgba(0, 212, 255, 0.7)',
                        borderColor: '#00d4ff',
                        borderWidth: 1
                    },
                    {
                        label: 'DRAM 月增速 (%)',
                        data: dramGrowth,
                        backgroundColor: 'rgba(123, 44, 191, 0.7)',
                        borderColor: '#7b2cbf',
                        borderWidth: 1
                    }
                ]
            },
            options: {
                ...chartOptions,
                plugins: {
                    ...chartOptions.plugins,
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `${context.dataset.label}: ${context.raw}%`;
                            }
                        }
                    }
                }
            }
        });

        // 累计增长率图
        new Chart(document.getElementById('cumulativeChart'), {
            type: 'line',
            data: {
                labels: months,
                datasets: [
                    {
                        label: 'NAND 累计增长率 (%)',
                        data: nandCumulative,
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0, 212, 255, 0.2)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    },
                    {
                        label: 'DRAM 累计增长率 (%)',
                        data: dramCumulative,
                        borderColor: '#7b2cbf',
                        backgroundColor: 'rgba(123, 44, 191, 0.2)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }
                ]
            },
            options: {
                ...chartOptions,
                plugins: {
                    ...chartOptions.plugins,
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `${context.dataset.label}: ${context.raw}%`;
                            }
                        }
                    }
                }
            }
        });

        // 填充数据表
        const tableBody = document.getElementById('dataTableBody');
        for (let i = 0; i < months.length; i++) {
            const row = document.createElement('tr');
            const nandGrowthClass = nandGrowth[i] >= 0 ? 'positive-cell' : 'negative-cell';
            const dramGrowthClass = dramGrowth[i] >= 0 ? 'positive-cell' : 'negative-cell';
            const nandGrowthSymbol = nandGrowth[i] >= 0 ? '↑' : '↓';
            const dramGrowthSymbol = dramGrowth[i] >= 0 ? '↑' : '↓';

            row.innerHTML = `
                <td>2025年${months[i]}</td>
                <td>$${nandPrices[i].toFixed(2)}</td>
                <td class="${nandGrowthClass}">${nandGrowthSymbol} ${Math.abs(nandGrowth[i]).toFixed(2)}%</td>
                <td>$${dramPrices[i].toFixed(2)}</td>
                <td class="${dramGrowthClass}">${dramGrowthSymbol} ${Math.abs(dramGrowth[i]).toFixed(2)}%</td>
            `;
            tableBody.appendChild(row);
        }
    </script>
</body>
</html>
